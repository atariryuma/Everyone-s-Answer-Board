name: CI

on:
  push:
    branches: [main]
    # scripts/** と docs/** も対象: theme:perfect が scripts/theme-*.js を spawn し、
    #   axis 20 は docs/THEME.md の保守フロー記載を判定するため (docs 再編でゲートが壊れた実績あり)。
    paths: ['src/**', 'tests/**', 'scripts/**', 'docs/**', 'CLAUDE.md', 'package.json', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'docs/**', 'CLAUDE.md', 'package.json', '.github/workflows/ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        # node-version は engines の下限 (>=20) に合わせて 20 に固定する。
        #   ローカル開発は Node 24 なので、CI が下限を踏むことで版差バグを検出できる
        #   (実際 node:test の既定レポーター差 tap/spec による誤判定を CI が捕捉した)。
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print toolchain versions
        # Why: CI log exposes node + clasp version so a quiet clasp minor bump
        #   that breaks our push/deploy flow is discoverable in history.
        run: |
          node --version
          npx clasp --version

      - name: Check JavaScript syntax
        run: |
          errors=0
          for file in src/*.js; do
            if ! node --check "$file" 2>/dev/null; then
              echo "Syntax error: $file"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors file(s) with syntax errors"
            exit 1
          fi

      - name: Lint (CLAUDE.md rules, error severity)
        # Why: pre-commit hook を bypass (--no-verify) したコミットや hook 未設定環境からの
        #   push でも CLAUDE.md ルール違反 (setTimeout / getEffectiveUser 等) を CI で捕捉する。
        run: npm run lint:errors

      - name: Run unit tests
        run: npm test

      - name: Theme quality gate (theme:perfect 全軸)
        # Why: theme:perfect は 32 軸の統合ゲート (theme-bleed / dark: prefix / token 完備 /
        #   ドキュメント整合 等) だが CI にも pre-commit にも入っておらず、2026-07 の docs 再編で
        #   axis 20 がサイレントに壊れ 2 日以上検出されなかった。実行 ~2 秒と安価なので常時回す。
        run: npm run theme:perfect
