<!-- =====================================================================
  SharedIcons — UI アイコンの単一ソース (v2888)

  Why: 従来 UI は絵文字 (🎒 📋 ✨ 🔧 …) をアイコン代わりに使っていた。
    絵文字は (1) OS/ブラウザでレンダリングが変わる (2) 電子黒板の投影で
    潰れて判別できない (3) 色が固定でテーマに追従しない (4) 意味の統一が
    効かない、という 4 点で教室利用に耐えない。
    ここで stroke ベースの line icon 1 セットに統一する。

  使い方:
    <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>
    サイズは font-size 追従 (1.25em)。色は currentColor 追従。
    サイズ修飾: .icon-sm / .icon-lg / .icon-xl

  追加するとき:
    - 24x24 viewBox / stroke ベース / fill なし で描く (塗りが要る場合のみ
      個別に fill="currentColor" を付ける)
    - 名前は「見た目」でなく「意味」で付ける (pie-chart は OK、orange-circle は NG)
    - 絵文字を新規に UI へ書かない。lint (npm run lint) が検出する。
===================================================================== -->
<style>
  .icon {
    width: 1.25em;
    height: 1.25em;
    flex: none;
    display: inline-block;
    vertical-align: -0.22em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    /* 投影時に細線が飛ばないよう、拡大時は線幅を維持する */
    vector-effect: non-scaling-stroke;
  }
  .icon-sm { width: 1em; height: 1em; }
  .icon-lg { width: 1.5em; height: 1.5em; }
  .icon-xl { width: 2rem; height: 2rem; stroke-width: 1.5; }

  /* spin: 読み込み中の loader 用。prefers-reduced-motion では停止。 */
  .icon-spin { animation: icon-spin 900ms linear infinite; }
  @keyframes icon-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .icon-spin { animation: none; }
  }
</style>
