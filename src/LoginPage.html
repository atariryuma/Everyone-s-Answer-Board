    <style> /* Login Page Specific Styles - Unified with Admin Panel */
      .login-background {
        background: var(--theme-bg-base);
        min-height: 100vh;
        position: relative;
        overflow: auto;
        animation: fadeIn var(--animation-slow) ease-out;
      }

      .login-background::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--brand-primary) 10%, transparent) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
        pointer-events: none;
      }

      .login-container {
        max-width: 420px;
        width: 90%;
        min-height: 580px;
        max-height: 90vh;
        overflow-y: auto;
        animation: slideUp 0.6s ease-out;
      }

      /* Responsive design matching admin panel breakpoints */
      @media (max-width: 640px) {
        .login-container {
          width: 95%;
          max-width: 380px;
          min-height: 520px;
          padding: var(--space-6);
        }

        .login-btn {
          min-height: 48px;
          padding: var(--space-4) var(--space-6);
          font-size: 16px;
        }
      }

      @media (max-width: 768px) {
        .login-container {
          padding: var(--space-4);
        }
      }

      @media (max-height: 700px) {
        .login-container {
          min-height: auto;
          max-height: 85vh;
        }
      }

      @media (min-width: 768px) {
        .login-container {
          padding: var(--space-8);
        }
      }

      @media (min-width: 1024px) {
        .login-container {
          max-width: 450px;
          padding: var(--space-10);
        }
      }

      /* Button animation enhancements */
      .login-btn {
        position: relative;
        overflow: hidden;
        transition: all var(--transition-normal) var(--transition-easing);
      }

      .login-btn::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transition: all var(--animation-normal) var(--transition-easing);
        transform: translate(-50%, -50%);
        z-index: 0;
      }

      .login-btn:not(:disabled):active::before {
        width: 200%;
        height: 200%;
      }

      .login-btn > * {
        position: relative;
        z-index: 1;
      }


      /* Form field subtle bounce animation */
      @keyframes subtle-bounce {
        0% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-2px);
        }
        100% {
          transform: translateY(-1px);
        }
      }

      /* Enhanced transition for interactive elements */
      .text-cyan-400:hover,
      .underline:hover {
        transition: all var(--transition-normal) var(--transition-easing);
      }

      /* Keyframe for fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
</head>
