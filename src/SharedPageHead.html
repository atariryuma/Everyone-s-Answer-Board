<!-- =====================================================================
  SharedPageHead — 全ページ共通の <head> 定型 (v2899)

  Why: 従来は 9 つの HTML テンプレートが同じ meta / base / viewport と
    4 つの include を各自で書いており、しかも順序がページごとに揺れていた。
    CLAUDE.md は「include order は固定。変更には独立コミットが必要」と
    規定しているが、その順序が 9 箇所に散っていては規約を守りようがない。
    順序をこのファイル 1 つに閉じ込め、規約を構造で強制する。

  読み込み順序 (この順序に意味がある。動かすときは独立コミットで):
    1. SharedSecurityHeaders — CSP。他の何よりも先に効かせる
    2. SharedThemeBoot       — paint 前に <html> へ theme class を付け FOUC を防ぐ
    3. UnifiedStyles.css     — semantic token とプリミティブの本体
    4. UtilityStyles.css     — Tailwind 互換の静的 utility (自動生成)。
                               primitive を上書きできるよう必ず最後に読む

  使い方 (各ページの <head> 内):
    <title>ページ固有のタイトル</title>
    include('SharedPageHead') をスクリプトレットで囲んで書く
    <style> /* ページ固有のスタイルだけをここに */ </style>

  注意: この用例をスクリプトレット記法そのままで書いてはいけない。 include() は
    createTemplateFromFile().evaluate() (main.js) なので、 HTML コメント内であっても
    スクリプトレットは評価される。 ここに書くと自分自身を無限 include して全ページが落ちる。
    SharedThemeBoot も同じ理由で用例から記法を外している。

  含めないもの:
    - <title> : ページごとに異なるため各ページで書く
    - SharedIcons : SVG sprite は <use> 解決のため <body> 先頭に置く必要がある
===================================================================== -->
<meta charset="UTF-8" />
<base target="_top" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<?!= include('SharedSecurityHeaders'); ?>
<?!= include('SharedThemeBoot'); ?>
<?!= include('UnifiedStyles.css'); ?>
<?!= include('UtilityStyles.css'); ?>
