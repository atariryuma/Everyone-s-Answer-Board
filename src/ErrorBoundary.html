<? if (typeof title !== 'undefined' && title) { ?>
<!doctype html>
<html lang="ja">
  <head>
  <title><?= title || 'エラー' ?> - みんなの回答ボード</title>
  <?!= include('SharedPageHead'); ?>
    <script>
      var WEB_APP_URL = '<?= typeof webAppUrl !== "undefined" ? webAppUrl : "" ?>';

      function safeReload() {
        if (WEB_APP_URL) {
          window.open(WEB_APP_URL, '_top');
        } else {
          alert('ページの更新に失敗しました。ブラウザのリロードボタンを押してください。');
        }
      }

      function goToTop() {
        if (WEB_APP_URL) {
          window.open(WEB_APP_URL, '_top');
        } else {
          alert('ページに移動できませんでした。ブラウザのアドレスバーからアクセスしてください。');
        }
      }
    </script>
</head>
  <body class="app-body min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full text-center space-y-6">
      <div class="text-theme-status-warning" role="img" aria-label="警告"><svg class="icon icon-xl" aria-hidden="true"><use href="#i-alert-triangle"></use></svg></div>
      <h1 class="text-2xl font-bold text-theme"><?= title || 'エラーが発生しました' ?></h1>
      <p class="text-theme-secondary leading-relaxed">
        <?= message || 'システムエラーが発生しました。管理者にお問い合わせください。' ?>
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4">
        <button type="button" class="btn btn-primary" onclick="safeReload()">
          再読み込み
        </button>
        <button type="button" class="btn btn-secondary" onclick="goToTop()">
          トップページに戻る
        </button>
      </div>
      <? if (!webAppUrl) { ?>
      <p class="text-xs text-theme-status-warning">URLの取得に失敗しました。ブラウザの戻るボタンまたはリロードをお試しください。</p>
      <? } ?>

      <p class="text-xs text-theme-muted pt-4"><?= new Date().toLocaleString('ja-JP') ?></p>
    </div>
  </body>
</html>
<? } ?>
