<script> /* =====================================================================
   * login.js — ログイン画面 (mode=login)
   *
   * 責任範囲:
   *   - Session 認証 (Google アカウント検出 + 表示)
   *   - 管理パネル遷移 (processLoginAction → adminUrl 生成)
   *   - ドメインバッジ表示 (組織ドメイン一致を視覚化)
   *   - アカウント切替 (AccountChooser 経由)
   *   - 成功画面レンダリング失敗時の last-resort fallback (native confirm)
   *
   * 全 GAS 呼び出しは runServer 経由。 唯一の例外: 成功画面が失敗した直後の
   * confirm() (modal system 自体も信頼できない最終 fallback)。
   * ===================================================================== */

  function setLoginButtonState(disabled, text = 'はじめる') {
    const loginBtn = document.getElementById('login-btn');
    if (loginBtn) {
      loginBtn.disabled = disabled;
      loginBtn.textContent = text;
      // disabled=true のときスピナーを表示。OAuth 起動中に複数 click 防止。
      loginBtn.classList.toggle('btn-busy', !!disabled);
    }
  }

  let cachedLoginUrl = '';

  async function init() {
    try {

      setLoginButtonState(true, '読み込み中');

      // リダイレクト用URLをプリフェッチ (失敗時は cachedLoginUrl 未設定のまま fallback パスへ)
      runServer('getWebAppUrl').then(function(url) { if (url) cachedLoginUrl = url + '?mode=login'; }, function() {});

      const loginBtn = document.getElementById('login-btn');
      const userEmailDisplay = document.getElementById('user-email-display');

      if (!loginBtn) {
        console.error('Critical: login-btn element not found');
        return;
      }
      if (!userEmailDisplay) {
        console.error('Critical: user-email-display element not found');
        return;
      }

      initLogin();

      loginBtn.addEventListener('click', () => {
        try {
          handleLogin();
        } catch (error) {
          console.error('Login handler failed:', error);
          userEmailDisplay.textContent = 'ログイン処理でエラーが発生しました。ページを更新してください。';
          userEmailDisplay.classList.add('text-red-400');
        }
      });

      const domainInfo = await fetchDomainInfo();
      displayDomainInfo(domainInfo);

      try {
        displayCurrentUserEmail();
      } catch (error) {
        console.error('Display user email failed:', error);
        if (!userEmailDisplay.dataset.emailSet) {
          setEmailDisplayDefault();
        }
        setLoginButtonState(false);
      }

    } catch (error) {
      console.error('Initialization failed:', error);

      if (window.notifications) {
        window.notifications.error('初期化に失敗しました。ページを再読み込みしてください。', 10000);
      }

      const userEmailDisplay = document.getElementById('user-email-display');
      if (userEmailDisplay) {
        userEmailDisplay.textContent = '初期化エラーが発生しました。ページを更新してください。';
        userEmailDisplay.classList.add('text-red-400');
      }

      const loginBtn = document.getElementById('login-btn');
      if (loginBtn) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'はじめる';
      }
    }
  }

  function initLogin() {
    try {

      const loginBtn = document.getElementById('login-btn');
      const userEmailDisplay = document.getElementById('user-email-display');

        let loginState = {};
        let isLogoutRedirect = false;
        let fallbackReason = null;

        loginState = {};
        isLogoutRedirect = false;
        fallbackReason = null;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
          isLogoutRedirect = true;
        }
        if (urlParams.get('fallback')) {
          fallbackReason = urlParams.get('fallback');
        }

        if (isLogoutRedirect && userEmailDisplay) {
          let statusMessage = 'ログアウトが完了しました。新しくログインしてください。';

          if (fallbackReason) {
            if (fallbackReason.includes('server_error')) {
              statusMessage = 'サーバーエラーが発生しましたが、ログアウトは完了しました。';
            } else if (fallbackReason.includes('critical_error')) {
              statusMessage = 'システムエラーが発生しましたが、セッションはクリアされました。';
            }
          }

          userEmailDisplay.textContent = statusMessage;
          userEmailDisplay.classList.add('text-green-400');



          createPromiseDelay(3000).then(() => {
            if (userEmailDisplay) {
              userEmailDisplay.textContent = 'Google アカウントでログインしてください';
              userEmailDisplay.classList.remove('text-green-400');
            }
          }).catch(() => {
          });
        }

        if (isLogoutRedirect) {
          if ('caches' in window) {
            caches.keys().then(names => {
              names.forEach(name => {
                if (name.includes('login') || name.includes('admin')) {
                  caches.delete(name);
                }
              });
            }).catch(e => console.warn('Cache clear failed:', e));
          }

          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
              command: 'clearCache',
              reason: 'logout_redirect'
            });
          }

        }

      } catch (error) {
        console.warn('Fresh login experience initialization failed:', error);
      }

  }


  const processUnifiedLogin = async () => {
      // userEmailDisplay はこの関数スコープには無いので必ずローカルで取得する。
      // 省くと成功パスは動くが全エラーパスが ReferenceError で握りつぶされる。
      const userEmailDisplay = document.getElementById('user-email-display');
      let response;
      try {
        response = await runServer('processLoginAction');
      } catch (error) {
        if (userEmailDisplay) {
          userEmailDisplay.textContent = `エラー: ${error.message}`;
          userEmailDisplay.classList.add('text-red-400');
        }
        setLoginButtonState(false);
        throw error;
      }

      if (!response || !response.success) {
        const errorMsg = response?.message || 'ログイン処理に失敗しました';
        if (userEmailDisplay) {
          userEmailDisplay.textContent = errorMsg;
          userEmailDisplay.classList.add('text-red-400');
        }
        throw new Error(errorMsg);
      }

      const adminUrl =
        response.adminUrl ||
        response.redirectUrl ||
        response.appUrl ||
        response.url ||
        '';

      if (typeof adminUrl === 'string' && adminUrl.trim().length > 0) {
        showAdminPanelRedirect(adminUrl, response.message);
      } else {
        console.error('processUnifiedLogin: 管理URLが返されませんでした', response);
        if (userEmailDisplay) {
          userEmailDisplay.textContent = 'ログインは成功しましたが、管理URLが見つかりません。管理者に連絡してください。';
          userEmailDisplay.classList.add('text-yellow-400');
        }
        setLoginButtonState(false);
      }
    };


    const setEmailDisplayDefault = () => {
      const userEmailDisplay = document.getElementById('user-email-display');
      if (!userEmailDisplay) return;
      userEmailDisplay.textContent = 'Google アカウントでログインしてください';
      userEmailDisplay.classList.remove('text-red-400', 'text-yellow-400', 'text-blue-400');
      userEmailDisplay.dataset.emailSet = '';
    };

    const displayCurrentUserEmail = async () => {
      const userEmailDisplay = document.getElementById('user-email-display');
      if (!userEmailDisplay) {
        console.error('userEmailDisplay element not found');
        return;
      }
      userEmailDisplay.textContent = 'アカウント情報を確認中...';

      let email;
      try {
        email = await runServer('getCurrentEmail');
      } catch (error) {
        console.warn('Email fetch failed:', error.message);
        setEmailDisplayDefault();
        setLoginButtonState(false);
        return;
      }

      if (!(email && typeof email === 'string')) {
        setEmailDisplayDefault();
        setLoginButtonState(false);
        return;
      }

      const emailText = ` ${email}`;
      userEmailDisplay.textContent = emailText;
      userEmailDisplay.classList.remove('text-red-400', 'text-yellow-400');
      userEmailDisplay.classList.add('text-blue-400');
      userEmailDisplay.dataset.emailSet = 'true';

      const emailProtector = setInterval(() => {
        if (userEmailDisplay.dataset.emailSet === 'true' &&
            userEmailDisplay.textContent !== emailText) {
          userEmailDisplay.textContent = emailText;
          userEmailDisplay.classList.remove('text-red-400', 'text-yellow-400');
          userEmailDisplay.classList.add('text-blue-400');
        }
      }, 800);

      createPromiseDelay(5000).then(() => clearInterval(emailProtector)).catch(() => {});

      setLoginButtonState(false);
    };

    const handleLoginError = (err) => {
      console.error('Login error:', err);

      const displayMessage = err?.message ||
                            (typeof err === 'string'? err : 'ログイン処理エラーが発生しました');

      const userEmailDisplay = document.getElementById('user-email-display');
      if (userEmailDisplay && !userEmailDisplay.dataset.emailSet) {
        userEmailDisplay.textContent = displayMessage;
        userEmailDisplay.classList.add('text-red-400');
      }
      setLoginButtonState(false);
    };

    const handleLogin = async () => {
      try {
        setLoginButtonState(true, '処理中…');
        // forceUrlSystemReset の成否に関わらず processUnifiedLogin に進む (失敗時のみ warn)
        try {
          await runServer('forceUrlSystemReset');
        } catch (error) {
          console.warn('URL system reset failed:', error);
        }
        processUnifiedLogin().catch(handleLoginError);
      } catch (err) {
        console.error('Login function error:', err);
        const userEmailDisplay = document.getElementById('user-email-display');
        if (userEmailDisplay) userEmailDisplay.textContent = 'ログイン処理エラー';
        setLoginButtonState(false);
      }
    };


    /**
     * ローカルドメイン情報表示 - ログインページ専用
     */
    function displayDomainInfo(info) {
      // v2903: 「一致」「確認中」のパネルは撤去した。ログインできること自体が
      //   ドメイン一致の証明なので、わざわざ緑のパネルで知らせる必要がない。
      //   組織外アカウントのときだけ、なぜ先に進めないのかを示す。
      const mismatch = document.getElementById('header-domain-mismatch');
      if (!mismatch) return;
      if (info.error || info.isValidDomain) {
        mismatch.classList.add('hidden');
        return;
      }
      const label = document.getElementById('header-domain-mismatch-text');
      if (label) label.textContent = info.domain ? `組織外のアカウントです (${info.domain})` : '組織外のアカウントです';
      mismatch.classList.remove('hidden');
    }

    /**
     * ローカルドメイン情報取得 - ログインページ専用
     */
    async function fetchDomainInfo() {
      if (!google?.script?.run?.getDeployUserDomainInfo) {
        return { isValidDomain: true, domain: 'unknown' };
      }
      try {
        return await runServer('getDeployUserDomainInfo');
      } catch (error) {
        console.error('Domain info fetch failed:', error);
        return { error: true };
      }
    }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

    window.switchAccount = function() {
      const btn = document.getElementById('switch-account-btn');
      // 連打抑制: アカウント切替 OAuth が複数飛ばないように。target='_top' なので
      // 物理的には 1 page しか開かないが、複数 click で auth 状態が乱れるのを防ぐ。
      if (btn && window.sharedUtilities?.buttons && !window.sharedUtilities.buttons.navOnce(btn)) {
        return;
      }
      const url = cachedLoginUrl || window.location.href;
      window.open(
        'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(url),
        '_top'
      );
    };






  /**
   * 管理パネルアクセス成功画面を表示 (ユーザーアクティベーション必須)
   * @param {string} adminUrl - 管理パネルのURL
   * @param {string} message - 表示メッセージ
   */
  function showAdminPanelRedirect(adminUrl, message) {
    try {
      if (!adminUrl || typeof adminUrl !== 'string') {
        console.error('showAdminPanelRedirect: 無効なadminUrlが渡されました:', adminUrl);
        if (window.notifications) {
          window.notifications.error('管理パネルのURLが無効です。再読み込みしてください。', 7000);
        } else {
          alert('管理パネルのURLが無効です。ページを再読み込みしてください。');
        }
        return;
      }

      // Why: the upcoming template interpolates adminUrl into an href and an
      //      inline onclick string. escapeHtml can't neutralize javascript: /
      //      data: protocols, nor can it safely escape single quotes for use
      //      inside a JS-string argument. Reject anything that isn't https://
      //      before it can reach those sinks.
      if (!/^https:\/\//i.test(adminUrl)) {
        console.error('showAdminPanelRedirect: adminUrl is not https:', adminUrl);
        if (window.notifications) {
          window.notifications.error('管理パネルのURLが無効です。再読み込みしてください。', 7000);
        } else {
          alert('管理パネルのURLが無効です。ページを再読み込みしてください。');
        }
        return;
      }

      const safeMessageRaw = message || 'ログインが完了しました';

      setLoginButtonState(false);

      // v2905: 以前はここでログイン成功画面を 205 行のインライン HTML + CSS として
      //   組み立て、document.body.innerHTML に丸ごと差し込んでいた。アプリの
      //   primitive を一切使わず、グラデーション背景・backdrop-filter・
      //   ハードコード色を自前で書き直した「2 つ目の UI」になっていた。
      //   同じ用途の showRedirectModal が SharedUtilities にあるので、それに寄せる。
      const openAdmin = () => {
        try { window.top.location.href = adminUrl; }
        catch (_) { window.location.href = adminUrl; }
      };
      if (typeof window.showRedirectModal === 'function') {
        window.showRedirectModal({
          title: safeMessageRaw,
          message: 'このURLをブックマークしておくと、次回から直接開けます。他の人とは共有しないでください。',
          redirectUrl: adminUrl,
          buttonLabel: '管理パネルを開く',
          variant: 'green'
        });
      } else {
        openAdmin();
      }

    } catch (error) {
      console.error('成功画面表示エラー:', error);
      const userChoice = confirm(
        `${message || 'ログインが完了しました'}\\n\\n管理パネルにアクセスしますか？`
      );
      if (userChoice) {
        const linkElement = document.createElement('a');
        linkElement.href = adminUrl;
        linkElement.target = '_top';
        linkElement.textContent = '管理パネルを開く';
        // theme:exempt — fallback ボタン (popup ブロック時)、 brand-success green を維持
        linkElement.style.cssText =
          'display:block;padding:20px;background:#4CAF50;color:white;text-align:center;text-decoration:none;margin:20px;border-radius:5px;';
        document.body.innerHTML = '';
        document.body.appendChild(linkElement);
      }
    }
  }


</script>
