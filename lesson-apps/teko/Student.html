<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Common'); ?>
</head>
<body>
  <main>
    <h1><?= lessonTitle ?> <span id="cls"></span></h1>
    <div class="card">
      <div class="phase-name" id="phase-name">読み込み中…</div>
      <p class="question" id="question"></p>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="body"></div>
  </main>
<script>
  // 画面はフェーズが決める。書いている途中の子の入力を消さないよう、
  //   フェーズが変わったときだけ作り直し、それ以外は他の子の分布だけ差し替える。
  const POLL_MS = 5000;
  let view = null;
  let renderedKey = '';
  let picked = null;

  function draftKey(v) { return 'draft:' + v.cls + ':' + v.phaseIndex; }
  function saveDraft() {
    if (!view) return;
    const ta = document.getElementById('reason');
    try {
      localStorage.setItem(draftKey(view), JSON.stringify({ picked, reason: ta ? ta.value : '' }));
    } catch (_) { /* 端末に残せないだけ。送信には影響しない */ }
  }
  function loadDraft(v) {
    try { return JSON.parse(localStorage.getItem(draftKey(v)) || 'null'); } catch (_) { return null; }
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderInput(v, body) {
    const draft = loadDraft(v);
    picked = (draft && draft.picked) || (v.mine ? { x: v.mine.x, y: v.mine.y } : null);
    const card = el('div', 'card');
    card.appendChild(el('p', 'muted', 'あてはまるところを 1 つ押してから、理由を書いて「送る」。'));
    const mapBox = el('div');
    card.appendChild(mapBox);
    const markers = [];
    if (v.phase.role === 'reinput' && v.first) markers.push({ x: v.first.x, y: v.first.y, text: '●', title: 'さいしょの考え' });
    const draw = () => renderMatrix(mapBox, {
      grid: v.grid, axis: v.axis, markers,
      selected: picked,
      onPick: (x, y) => { picked = { x, y }; draw(); saveDraft(); }
    });
    draw();
    if (v.phase.role === 'reinput' && v.first) {
      const prev = el('div', 'banner');
      prev.append(el('strong', null, '● さいしょのことば：'), document.createTextNode(v.first.reason));
      card.appendChild(prev);
    }
    const label = el('p', null, '理由');
    const ta = el('textarea');
    ta.id = 'reason';
    ta.maxLength = 400;
    ta.value = (draft && draft.reason) || (v.mine ? v.mine.reason : '');
    ta.addEventListener('input', saveDraft);
    const btn = el('button', 'btn btn-primary', '送る');
    const status = el('div', 'status');
    if (v.mine) { status.className = 'status ok'; status.textContent = '送りました。直したいときは、もう一度「送る」。'; }
    btn.addEventListener('click', async () => {
      if (!picked) { status.className = 'status err'; status.textContent = '位置を 1 つ押してください'; return; }
      if (!ta.value.trim()) { status.className = 'status err'; status.textContent = '理由を書いてください'; return; }
      btn.disabled = true; status.className = 'status'; status.textContent = '送っています…';
      try {
        const res = await call('submitAnswer', { x: picked.x, y: picked.y, reason: ta.value, phaseIndex: v.phaseIndex });
        if (res.ok) { status.className = 'status ok'; status.textContent = '送りました。直したいときは、もう一度「送る」。'; }
        else { status.className = 'status err'; status.textContent = res.message; if (res.code === 'PHASE_CHANGED') poll(); }
      } catch (e) {
        status.className = 'status err'; status.textContent = '送れませんでした。もう一度「送る」を押してください';
      } finally { btn.disabled = false; }
    });
    card.append(label, ta, el('div'), btn, status);
    body.appendChild(card);
  }

  function renderBrowse(v, body) {
    const card = el('div', 'card');
    card.appendChild(el('p', 'muted', '「' + v.sourcePhaseName + '」で、みんなが置いたところ（数字は人数・紫のわくはあなた）'));
    const mapBox = el('div');
    renderMatrix(mapBox, { grid: v.grid, axis: v.axis, dots: v.others });
    card.appendChild(mapBox);
    body.appendChild(card);
    const list = el('div', 'card');
    list.appendChild(el('p', 'muted', 'みんなの理由'));
    const box = el('div');
    renderReasons(box, v.axis, v.others.filter(o => o.reason));
    list.appendChild(box);
    body.appendChild(list);
  }

  function renderDiscuss(v, body) {
    const card = el('div', 'card');
    card.appendChild(el('p', 'question', '画面をとじて、話そう'));
    body.appendChild(card);
  }

  function renderReflect(v, body) {
    const card = el('div', 'card');
    const markers = [];
    if (v.first) markers.push({ x: v.first.x, y: v.first.y, text: '●', title: 'さいしょ' });
    if (v.second) markers.push({ x: v.second.x, y: v.second.y, text: '★', title: 'もう一度考えたあと' });
    card.appendChild(el('p', 'muted', '● さいしょ　★ もう一度考えたあと'));
    const mapBox = el('div');
    renderMatrix(mapBox, { grid: v.grid, axis: v.axis, markers });
    card.appendChild(mapBox);
    if (v.first) card.append(el('p', null, '● ' + v.first.reason));
    if (v.second) card.append(el('p', null, '★ ' + v.second.reason));
    card.appendChild(el('p', 'muted', 'ふりかえりは、ノートに書こう。'));
    body.appendChild(card);
  }

  function render(v) {
    const key = v.cls + ':' + v.phaseIndex;
    document.getElementById('cls').textContent = '（' + v.cls + '）';
    document.getElementById('phase-name').textContent = v.phase.name;
    document.getElementById('question').textContent = v.phase.question;
    const role = v.phase.role;
    // 書くフェーズは、書いている途中を消さないため作り直さない。読むフェーズは毎回最新にする。
    if (key === renderedKey && (role === 'input' || role === 'reinput' || role === 'discuss')) return;
    const changed = key !== renderedKey;
    renderedKey = key;
    const body = document.getElementById('body');
    body.textContent = '';
    if (role === 'input' || role === 'reinput') renderInput(v, body);
    else if (role === 'browse') renderBrowse(v, body);
    else if (role === 'discuss') renderDiscuss(v, body);
    else renderReflect(v, body);
    if (changed) window.scrollTo(0, 0);
  }

  async function poll() {
    try {
      view = await call('getStudentView');
      document.getElementById('banner').hidden = true;
      render(view);
    } catch (e) {
      const b = document.getElementById('banner');
      b.textContent = '先生のアプリとつながっていません。しばらく待つか、ページを開き直してください。';
      b.hidden = false;
    }
  }

  function init() {
    poll();
    // 30 人が同じ瞬間に読まないよう、間隔に揺らぎを入れる。
    const tick = () => setTimeout(async () => { await poll(); tick(); }, POLL_MS + Math.random() * 2000);
    tick();
  }
  init();
</script>
</body>
</html>
