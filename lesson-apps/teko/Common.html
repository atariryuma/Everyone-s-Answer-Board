<style>
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --text: #1d2433; --muted: #5b6475; --border: #d5dbe5;
    --accent: #2563eb; --accent-soft: #dbe7ff; --mine: #7c3aed; --dot: #0f766e; --warn-bg: #fff7e6; --warn: #92400e;
    --radius: 12px; --gap: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; font-size: 16px; line-height: 1.6; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.05rem; margin: 0; color: var(--muted); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: var(--gap); }
  .phase-name { font-size: 0.9rem; color: var(--accent); font-weight: 700; }
  .question { font-size: 1.35rem; font-weight: 700; margin: 4px 0 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 10px 18px; min-height: 44px; cursor: pointer; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  textarea { width: 100%; font: inherit; border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 96px; resize: vertical; }
  .status { margin-top: 8px; font-weight: 600; }
  .status.ok { color: var(--dot); }
  .status.err { color: #b91c1c; }
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-top: var(--gap); }

  /* 5×5 の地図。横 = 手ごたえ、縦 = 迷い (上ほど迷いなし)。 */
  .matrix-wrap { display: grid; grid-template-columns: auto 1fr; gap: 6px; align-items: stretch; }
  .y-label { writing-mode: vertical-rl; display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
  /* Chromebook (高さ 768px 前後) で、地図の下の理由や「送る」まで目に入るよう高さを抑える。 */
  .matrix { display: grid; gap: 4px; height: clamp(220px, 45vh, 420px); }
  .cell { position: relative; border-radius: 8px; background: #eef2f8; border: 1px solid transparent;
    display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; padding: 2px; }
  .cell.mid { background: #e6ebf3; }
  .matrix.pickable .cell { cursor: pointer; }
  .matrix.pickable .cell:hover { border-color: var(--accent); }
  .cell.selected { background: var(--accent-soft); border-color: var(--accent); }
  .count { min-width: 28px; height: 28px; border-radius: 999px; background: var(--dot); color: #fff;
    font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .count.has-mine { box-shadow: 0 0 0 3px var(--mine); }
  .marker { font-size: 1.4rem; line-height: 1; color: var(--mine); }
  .x-labels { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 0.8rem; color: var(--muted); margin-left: 22px; }
  .x-labels span:nth-child(2) { text-align: center; }
  .x-labels span:nth-child(3) { text-align: right; }

  .reasons { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); }
  .reasons li { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 10px; white-space: pre-wrap; word-break: break-word; }
  .reasons li.mine { border-color: var(--mine); }
  .reasons .where { display: block; font-size: 0.8rem; color: var(--muted); }
</style>
<script>
  // 位置 (1..5) を言葉にする。横 3 = 変わらない。
  function placeLabel(axis, x, y) {
    const xs = x < 3 ? axis.xLow : x > 3 ? axis.xHigh : axis.xMid;
    const ys = y >= 4 ? axis.yHigh : y <= 2 ? axis.yLow : 'まん中';
    return xs + '・' + ys;
  }

  /**
   * 地図を描く。opts:
   *   grid, axis, dots: [{x, y, isMine}] (人数として集計), markers: [{x, y, text}] (● ★ など),
   *   selected: {x, y}, onPick: (x, y) => void (渡すと押せる)
   */
  function renderMatrix(container, opts) {
    const grid = opts.grid;
    container.textContent = '';
    const wrap = document.createElement('div');
    wrap.className = 'matrix-wrap';
    const yl = document.createElement('div');
    yl.className = 'y-label';
    const yHigh = document.createElement('span'); yHigh.textContent = opts.axis.yHigh;
    const yLow = document.createElement('span'); yLow.textContent = opts.axis.yLow;
    yl.append(yHigh, yLow);
    const m = document.createElement('div');
    m.className = 'matrix' + (opts.onPick ? ' pickable' : '');
    m.style.gridTemplateColumns = 'repeat(' + grid + ', 1fr)';
    m.style.gridTemplateRows = 'repeat(' + grid + ', 1fr)';

    const counts = {};
    (opts.dots || []).forEach(d => {
      const k = d.x + ',' + d.y;
      counts[k] = counts[k] || { n: 0, mine: false };
      counts[k].n++;
      if (d.isMine) counts[k].mine = true;
    });
    for (let y = grid; y >= 1; y--) {
      for (let x = 1; x <= grid; x++) {
        const cell = document.createElement(opts.onPick ? 'button' : 'div');
        if (opts.onPick) {
          cell.type = 'button';
          cell.setAttribute('aria-label', '左から' + x + '列目・上から' + (grid - y + 1) + '段目（' + placeLabel(opts.axis, x, y) + '）');
        }
        cell.className = 'cell' + (x === Math.ceil(grid / 2) ? ' mid' : '');
        if (opts.selected && opts.selected.x === x && opts.selected.y === y) cell.classList.add('selected');
        const c = counts[x + ',' + y];
        if (c) {
          const b = document.createElement('span');
          b.className = 'count' + (c.mine ? ' has-mine' : '');
          b.textContent = c.n;
          cell.appendChild(b);
        }
        (opts.markers || []).filter(mk => mk.x === x && mk.y === y).forEach(mk => {
          const s = document.createElement('span');
          s.className = 'marker';
          s.textContent = mk.text;
          s.title = mk.title || '';
          cell.appendChild(s);
        });
        if (opts.onPick) cell.addEventListener('click', () => opts.onPick(x, y));
        m.appendChild(cell);
      }
    }
    wrap.append(yl, m);
    const xl = document.createElement('div');
    xl.className = 'x-labels';
    [opts.axis.xLow, opts.axis.xMid, opts.axis.xHigh].forEach(t => {
      const s = document.createElement('span'); s.textContent = t; xl.appendChild(s);
    });
    container.append(wrap, xl);
  }

  function renderReasons(container, axis, items) {
    container.textContent = '';
    const ul = document.createElement('ul');
    ul.className = 'reasons';
    items.forEach(it => {
      const li = document.createElement('li');
      if (it.isMine) li.className = 'mine';
      const w = document.createElement('span');
      w.className = 'where';
      w.textContent = (it.isMine ? 'あなた・' : '') + placeLabel(axis, it.x, it.y);
      li.append(w, document.createTextNode(it.reason));
      ul.appendChild(li);
    });
    container.appendChild(ul);
  }

  // google.script.run の Promise 版。
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
</script>
